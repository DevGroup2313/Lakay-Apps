name: Lakay for the Fire tablet

# Builds Lakay's APK for the Fire tablet (and any Android tablet) on GitHub's
# Linux computer with Android's own tools, and puts it on the Releases page
# and in builds/. The app is Ingenium 6.0's Android shell (packages/fire) holding
# Lakay's page in assets/.
#
# SIGNING. Android installs a new version over an old one only when both carry
# the same key. The lasting key is kept as two repository secrets,
# EMPORIUM_ANDROID_KEY (the PKCS #12 key file, in base64) and
# EMPORIUM_ANDROID_KEY_PASSWORD; it never enters the repository, which is
# public. Until those secrets exist, each build is signed with a key made for
# that build alone: it installs on a tablet that has no Lakay yet, and a
# later build installs only after the earlier one is removed (which removes
# that tablet's books, so save a sealed backup first).

on:
  push:
    paths:
      - 'app/**'
      - 'build.json'
      - 'packages/fire/**'
      - 'release/publish.py'
      - '.github/workflows/fire.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Each device's repository holds only its own workflow (release/device_repos.py), so this runs wherever it is,
    # whatever the repository is called: a renamed repository still builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Read the build number and find Android's tools
        run: |
          BUILD=$(python3 -c "import json;print(int(json.load(open('build.json'))['build']))")
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          PLAT=$(ls -d "$ANDROID_HOME"/platforms/android-* | grep -v -i -E "beta|preview|ext" | sort -V | tail -n 1)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "PLAT=$PLAT" >> "$GITHUB_ENV"
          echo "APK=Lakay-Android-Fire.apk" >> "$GITHUB_ENV"
          echo "Build $BUILD; build tools $BT; platform $PLAT"; java -version

      - name: Compile the shell
        run: |
          mkdir -p build/classes build/dex
          javac -nowarn -source 1.8 -target 1.8 -bootclasspath "$PLAT/android.jar" -classpath "$PLAT/android.jar" \
            -encoding UTF-8 -d build/classes $(find packages/fire/src -name '*.java')
          "$BT/d8" --release --min-api 22 --lib "$PLAT/android.jar" --output build/dex $(find build/classes -name '*.class')
          ls -la build/dex

      - name: Put the page, the icons and the manifest together
        run: |
          mkdir -p build/assets
          cp app/Lakay.html build/assets/Lakay.html
          printf '{"page": "Lakay.html", "background": "#f6f4fa", "bridges": ["EmporiumHost"]}' > build/assets/shell.json
          "$BT/aapt2" compile --dir packages/fire/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PLAT/android.jar" --manifest packages/fire/AndroidManifest.xml \
            -R build/res.zip -A build/assets --min-sdk-version 22 --target-sdk-version 34 \
            --version-code "$BUILD" --version-name "Build $BUILD"
          (cd build/dex && zip -q -j ../base.apk classes.dex)
          "$BT/zipalign" -p -f 4 build/base.apk build/aligned.apk
          unzip -l build/aligned.apk

      - name: Sign it
        env:
          KEY_B64: ${{ secrets.EMPORIUM_ANDROID_KEY }}
          KEY_PASS: ${{ secrets.EMPORIUM_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/key.p12"
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/key.p12" -storetype PKCS12 -storepass "$KEY_PASS" | grep -i PrivateKeyEntry | head -n 1 | cut -d, -f1)
            echo "SIGN_NOTE=signed with the store's lasting key: installs over the build before" >> "$GITHUB_ENV"
          else
            KEY_PASS=$(openssl rand -hex 24)
            ALIAS=emporium
            keytool -genkeypair -keystore "$RUNNER_TEMP/key.p12" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 3072 \
              -validity 10000 -dname "CN=Lakay build $BUILD (one-build key)" -storepass "$KEY_PASS" -keypass "$KEY_PASS" 2>/dev/null
            echo "SIGN_NOTE=signed with a one-build key: remove an earlier Lakay (after a sealed backup) before installing" >> "$GITHUB_ENV"
            echo "::warning::No lasting signing key in the repository's secrets: this APK is signed with a key made for this build alone."
          fi
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/key.p12" --ks-type PKCS12 --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEY_PASS" --key-pass "pass:$KEY_PASS" --out "$RUNNER_TEMP/$APK" build/aligned.apk
          rm -f "$RUNNER_TEMP/key.p12"
          "$BT/apksigner" verify --verbose "$RUNNER_TEMP/$APK" | head -n 8
          "$BT/aapt2" dump badging "$RUNNER_TEMP/$APK" | head -n 6
          unzip -p "$RUNNER_TEMP/$APK" assets/Lakay.html | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/inside.txt"
          echo "page inside $(cat "$RUNNER_TEMP/inside.txt"), recorded $(cut -d' ' -f1 app/Lakay.html.sha256)"
          test "$(cat "$RUNNER_TEMP/inside.txt")" = "$(cut -d' ' -f1 app/Lakay.html.sha256)"

      - name: Put it on the Releases page and in builds/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 release/publish.py "$RUNNER_TEMP/$APK" "Fire tablet" "$SIGN_NOTE"
