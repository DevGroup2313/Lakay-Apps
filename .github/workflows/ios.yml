name: Lakay for iPhone and iPad

# Builds Lakay for iPhone and iPad on GitHub's own Macs (they have Xcode) and
# puts Lakay-iPhone-iPad.ipa on the Releases page and in builds/. One file
# works on both. The IPA is NOT signed: Sideloadly signs it with your Apple ID
# while it installs it over the cable, as Ingenium and Inkwell are installed.
# The app is Ingenium 6.0's iPhone and iPad shell (packages/ios) holding
# Lakay's page; made after Ingenium's shell build (build-shells.yml).

on:
  push:
    paths:
      - 'app/**'
      - 'build.json'
      - 'packages/ios/**'
      - 'release/publish.py'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # each device has its own repository; this one builds only in Lakay-Apps
    if: contains(github.repository, 'Lakay-Apps')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Read the build number
        run: |
          BUILD=$(python3 -c "import json;print(int(json.load(open('build.json'))['build']))")
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "IPA=Lakay-iPhone-iPad.ipa" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Put the page and the build number in the shell
        working-directory: packages/ios
        run: |
          cp ../../app/Lakay.html Shell/www/Lakay.html
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD" -c "Set :CFBundleVersion $BUILD" Shell/Info.plist
          ls -la Shell/www Shell/Icons

      - name: Make the Xcode project
        working-directory: packages/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone and iPad (unsigned)
        working-directory: packages/ios
        run: |
          set -o pipefail
          xcodebuild -project Lakay.xcodeproj -target Shell -configuration Release -sdk iphoneos \
            SYMROOT="$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/build-log.txt" 2>&1
          APP="$RUNNER_TEMP/build/Release-iphoneos/Lakay.app"
          ls -la "$APP"
          file "$APP/Lakay"
          plutil -lint "$APP/Info.plist"
          A=$(shasum -a 256 "$APP/www/Lakay.html" | cut -d' ' -f1); B=$(cut -d' ' -f1 ../../app/Lakay.html.sha256)
          echo "page inside $A, recorded $B"; test "$A" = "$B"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: If the build failed, show why
        if: failure()
        run: |
          grep -n "error:" "$RUNNER_TEMP/build-log.txt" | head -n 40 || echo "(no lines with error:)"
          tail -n 80 "$RUNNER_TEMP/build-log.txt" || echo "(no build log was written)"

      - name: Pack the IPA
        run: |
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/$IPA" Payload)
          ls -la "$RUNNER_TEMP/$IPA"

      - name: Put it on the Releases page and in builds/
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 release/publish.py "$RUNNER_TEMP/$IPA" "iPhone and iPad" "install it with Sideloadly, which signs it with your Apple ID"
